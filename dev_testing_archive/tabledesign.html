<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Materials & Pricing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom Scrollbar for extension windows */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Checkbox Switch Animation */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #6875f5;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #6875f5;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden font-sans text-sm">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-database text-indigo-600 text-lg"></i>
            <div>
                <h1 class="font-semibold text-slate-900 leading-tight">Stock Materials</h1>
                <p class="text-xs text-slate-500">Extension Database</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="loadDefaults()" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded transition-colors" title="Load Defaults">
                <i class="fa-solid fa-rotate"></i>
            </button>
            <button onclick="importCSV()" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded transition-colors" title="Import CSV">
                <i class="fa-solid fa-file-import"></i>
            </button>
            <button onclick="exportDB()" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded transition-colors" title="Export Database">
                <i class="fa-solid fa-file-export"></i>
            </button>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="bg-slate-50 border-b border-slate-200 p-3 flex flex-col gap-3 shrink-0 z-10">
        <div class="flex items-center justify-between gap-3">
            
            <!-- Search & Sort -->
            <div class="flex items-center gap-2 flex-1">
                <div class="relative flex-1 max-w-xs group">
                    <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-slate-400 group-focus-within:text-indigo-500"></i>
                    </div>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search materials..." 
                        class="block w-full pl-8 pr-3 py-1.5 border border-slate-300 rounded text-sm bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                    >
                    <button 
                        id="clearSearchBtn" 
                        class="absolute inset-y-0 right-0 pr-2 flex items-center text-slate-400 hover:text-slate-600 hidden"
                    >
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
                
                <button 
                    onclick="toggleSort()" 
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-300 rounded text-xs font-medium text-slate-700 hover:bg-slate-50 transition-colors whitespace-nowrap"
                >
                    <span id="sortLabel">A-Z</span>
                    <i id="sortIcon" class="fa-solid fa-arrow-down-a-z text-slate-400"></i>
                </button>
            </div>
        </div>

        <!-- Filters Row (Swapped order to prevent push) -->
        <div class="flex items-center justify-end gap-3 h-6">
            
            <!-- Clear Filters (Left side of the toggle, reserves space via opacity) -->
            <button 
                id="clearFiltersBtn"
                class="text-xs font-medium text-rose-600 hover:text-rose-700 flex items-center gap-1 px-2 py-0.5 rounded hover:bg-rose-50 transition-all opacity-0 pointer-events-none"
            >
                <i class="fa-solid fa-xmark"></i>
                <span>Clear Filters</span>
            </button>

            <div class="h-4 w-px bg-slate-300 mx-1"></div>

            <!-- Used Only Toggle -->
            <label class="flex items-center gap-2 cursor-pointer select-none group">
                <div class="relative inline-block w-8 h-4 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" id="usedOnlyToggle" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer border-slate-300 transition-all duration-200 top-0 left-0 peer checked:left-4 checked:border-indigo-600"/>
                    <div class="toggle-label block overflow-hidden h-4 rounded-full bg-slate-300 cursor-pointer peer-checked:bg-indigo-600 transition-colors duration-200"></div>
                </div>
                <span class="text-xs font-medium text-slate-600 peer-checked:text-indigo-700">Used Only</span>
            </label>
        </div>
    </div>

    <!-- Table Container (Expandable) -->
    <div class="flex-1 overflow-auto bg-white relative">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-4 py-3 border-b border-slate-200 cursor-pointer hover:text-indigo-600" onclick="setSort('name')">Material Name</th>
                    <th class="px-4 py-3 border-b border-slate-200 text-right cursor-pointer hover:text-indigo-600" onclick="setSort('width')">Width</th>
                    <th class="px-4 py-3 border-b border-slate-200 text-right cursor-pointer hover:text-indigo-600" onclick="setSort('height')">Height</th>
                    <th class="px-4 py-3 border-b border-slate-200 text-right cursor-pointer hover:text-indigo-600" onclick="setSort('thickness')">Thick</th>
                    <th class="px-4 py-3 border-b border-slate-200 text-right">Price</th>
                    <th class="px-4 py-3 border-b border-slate-200 text-center">Status</th>
                    <th class="px-4 py-3 border-b border-slate-200 text-right w-16"></th>
                </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100 text-xs sm:text-sm text-slate-700">
                <!-- Rows injected via JS -->
            </tbody>
        </table>
        
        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center h-full p-8 text-center">
            <div class="bg-slate-50 p-3 rounded-full mb-3">
                <i class="fa-solid fa-search text-slate-300 text-xl"></i>
            </div>
            <p class="font-medium text-slate-900">No materials found</p>
            <p class="text-xs text-slate-400 mt-1">Adjust filters to see more results.</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="bg-slate-50 border-t border-slate-200 px-4 py-2 text-xs text-slate-500 flex justify-between items-center shrink-0">
        <span id="totalCount">Total: 0</span>
        <span id="showingCount">Showing: 0</span>
    </div>

    <script>
        // --- Data ---
        // This array is ready to be populated by your extension
        let materials = [
            { id: 1, name: 'Auto_user_W242xH2342xTH18_(Auto_user)', width: 232, height: 2332, thickness: 18, price: 11.98, status: 'Not Used' },
            { id: 2, name: 'Auto_user_W242xH2342xTH18_(Silver_Metal)', width: 232, height: 2332, thickness: 18, price: 11.98, status: 'Not Used' },
            { id: 3, name: 'Auto_user_W332xH2432xTH18', width: 232, height: 2332, thickness: 18, price: 10.89, status: 'Used' },
            { id: 4, name: 'Auto_user_W350xH2432xTH18', width: 250, height: 2332, thickness: 18, price: 11.73, status: 'Used' },
            { id: 5, name: 'AWKWARD', width: 2440, height: 2700, thickness: 18, price: 0.00, status: 'Not Used' },
            { id: 6, name: 'AWKWARD (22.0mm)', width: 2440, height: 1220, thickness: 22, price: 0.00, status: 'Not Used' },
            { id: 7, name: 'Blue_Glass_Shelf', width: 2440, height: 1220, thickness: 8, price: 0.00, status: 'Not Used' },
            { id: 8, name: 'Cabinet_Body_Wood', width: 2440, height: 1220, thickness: 18, price: 0.00, status: 'Not Used' },
            { id: 9, name: 'MDF_16mm', width: 2440, height: 1220, thickness: 16, price: 25.00, status: 'Not Used' },
            { id: 10, name: 'MDF_19mm', width: 2440, height: 1220, thickness: 19, price: 30.00, status: 'Not Used' },
            { id: 11, name: 'Melamine_White', width: 2440, height: 1220, thickness: 18, price: 40.00, status: 'Not Used' },
            { id: 12, name: 'Oak_Veneer', width: 2440, height: 1220, thickness: 18, price: 85.00, status: 'Not Used' },
            { id: 13, name: 'Plywood_12mm', width: 2440, height: 1220, thickness: 12, price: 35.00, status: 'Not Used' },
            { id: 14, name: 'Plywood_19mm', width: 2440, height: 1220, thickness: 19, price: 45.00, status: 'Not Used' }
        ];

        // --- State ---
        let state = {
            searchTerm: '',
            usedOnly: false,
            sortKey: 'name',
            sortDirection: 'asc'
        };

        // --- Elements ---
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const usedOnlyToggle = document.getElementById('usedOnlyToggle');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');
        const totalCountEl = document.getElementById('totalCount');
        const showingCountEl = document.getElementById('showingCount');
        const sortLabel = document.getElementById('sortLabel');
        const sortIcon = document.getElementById('sortIcon');

        // --- Functions ---

        function init() {
            renderTable();
            setupEventListeners();
        }

        function getFilteredAndSortedData() {
            let result = materials.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(state.searchTerm.toLowerCase());
                const matchesStatus = state.usedOnly ? item.status === 'Used' : true;
                return matchesSearch && matchesStatus;
            });

            result.sort((a, b) => {
                let valA = a[state.sortKey];
                let valB = b[state.sortKey];

                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (valA < valB) return state.sortDirection === 'asc' ? -1 : 1;
                if (valA > valB) return state.sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            return result;
        }

        function renderTable() {
            const data = getFilteredAndSortedData();
            tableBody.innerHTML = '';

            if (data.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    const isUsed = item.status === 'Used';
                    tr.className = `group hover:bg-indigo-50 transition-colors border-b border-slate-50 last:border-0 ${isUsed ? '' : 'text-slate-500'}`;
                    
                    tr.innerHTML = `
                        <td class="px-4 py-2 font-medium break-all max-w-[200px] text-slate-900">
                            ${highlightMatch(item.name, state.searchTerm)}
                        </td>
                        <td class="px-4 py-2 text-right font-mono text-slate-600">${item.width}</td>
                        <td class="px-4 py-2 text-right font-mono text-slate-600">${item.height}</td>
                        <td class="px-4 py-2 text-right font-mono text-slate-600">${item.thickness}</td>
                        <td class="px-4 py-2 text-right font-medium text-slate-900">
                            ${item.price > 0 ? '$' + item.price.toFixed(2) : '<span class="text-slate-300">-</span>'}
                        </td>
                        <td class="px-4 py-2 text-center">
                            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-medium border ${isUsed ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-50 text-slate-500 border-slate-200'}">
                                <span class="w-1.5 h-1.5 rounded-full ${isUsed ? 'bg-emerald-500' : 'bg-slate-400'}"></span>
                                ${item.status}
                            </span>
                        </td>
                        <td class="px-4 py-2 text-right">
                             <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button class="p-1 text-slate-400 hover:text-indigo-600 rounded" title="Edit">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            }

            // Update Counts
            totalCountEl.textContent = `Total: ${materials.length}`;
            showingCountEl.textContent = `Showing: ${data.length}`;
            
            // Update Sort UI
            sortLabel.textContent = state.sortKey === 'name' ? (state.sortDirection === 'asc' ? 'A-Z' : 'Z-A') : 'Sorted';
            sortIcon.className = `fa-solid ${state.sortDirection === 'asc' ? 'fa-arrow-down-a-z' : 'fa-arrow-up-z-a'} text-slate-400`;

            // Update Clear Filters Button Visibility
            if (state.searchTerm || state.usedOnly) {
                clearFiltersBtn.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                clearFiltersBtn.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function highlightMatch(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${term})`, 'gi');
            return text.replace(regex, '<span class="bg-yellow-200 text-slate-900">$1</span>');
        }

        function setupEventListeners() {
            // Search
            searchInput.addEventListener('input', (e) => {
                state.searchTerm = e.target.value;
                clearSearchBtn.classList.toggle('hidden', !state.searchTerm);
                renderTable();
            });

            clearSearchBtn.addEventListener('click', () => {
                state.searchTerm = '';
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                renderTable();
            });

            // Toggle Used Only
            usedOnlyToggle.addEventListener('change', (e) => {
                state.usedOnly = e.target.checked;
                renderTable();
            });

            // Clear Filters
            clearFiltersBtn.addEventListener('click', () => {
                state.searchTerm = '';
                searchInput.value = '';
                state.usedOnly = false;
                usedOnlyToggle.checked = false;
                clearSearchBtn.classList.add('hidden');
                renderTable();
            });
        }

        // --- Exported Functions (for HTML attributes) ---
        
        window.setSort = function(key) {
            if (state.sortKey === key) {
                state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                state.sortKey = key;
                state.sortDirection = 'asc';
            }
            renderTable();
        };

        window.toggleSort = function() {
            setSort('name');
        };

        window.loadDefaults = () => {
             // Logic to reload default materials
             console.log("Loading defaults...");
             renderTable();
        };

        window.importCSV = () => console.log("Importing CSV...");
        window.exportDB = () => console.log("Exporting DB...");

        // Initialize
        init();

    </script>
</body>
</html>
