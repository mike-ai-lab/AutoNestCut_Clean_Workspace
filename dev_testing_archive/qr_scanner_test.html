<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner - AutoNestCut Test Tool</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .scanner-section {
            margin-bottom: 30px;
        }
        
        #reader {
            border: 2px solid #667eea;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        
        .result-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .result-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .result-content {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .json-display {
            color: #333;
        }
        
        .json-key {
            color: #0066cc;
            font-weight: bold;
        }
        
        .json-string {
            color: #008000;
        }
        
        .json-number {
            color: #cc0000;
        }
        
        .status {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .part-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .part-info-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }
        
        .part-info-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .part-info-value {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }
        
        .copy-btn {
            background: #28a745;
            padding: 8px 16px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .copy-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 QR Code Scanner</h1>
        <p class="subtitle">Test tool for AutoNestCut QR labels</p>
        
        <div class="scanner-section">
            <div class="controls">
                <button id="startBtn" onclick="startScanning()">📷 Start Camera</button>
                <button id="stopBtn" onclick="stopScanning()" disabled>⏹️ Stop Camera</button>
                <div class="file-input-wrapper">
                    <button>📁 Upload Image</button>
                    <input type="file" id="fileInput" accept="image/*" onchange="scanFile(event)">
                </div>
            </div>
            
            <div id="reader"></div>
        </div>
        
        <div class="result-section" id="resultSection" style="display: none;">
            <h3>📋 Scan Result</h3>
            <div id="statusMessage"></div>
            <div class="result-content" id="resultContent"></div>
            <div id="partInfo"></div>
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
        </div>
    </div>

    <script>
        let html5QrCode;
        let lastResult = '';
        
        async function startScanning() {
            const reader = document.getElementById('reader');
            
            html5QrCode = new Html5Qrcode("reader");
            
            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 250 }
                    },
                    onScanSuccess,
                    onScanFailure
                );
                
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                showStatus('Camera started. Point at a QR code...', 'info');
            } catch (err) {
                showStatus(`Error starting camera: ${err}`, 'error');
            }
        }
        
        async function stopScanning() {
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    showStatus('Camera stopped', 'info');
                } catch (err) {
                    showStatus(`Error stopping camera: ${err}`, 'error');
                }
            }
        }
        
        async function scanFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            try {
                const result = await html5QrCode.scanFile(file, true);
                onScanSuccess(result);
            } catch (err) {
                showStatus(`No QR code found in image: ${err}`, 'error');
            }
            
            // Reset file input
            event.target.value = '';
        }
        
        function onScanSuccess(decodedText, decodedResult) {
            lastResult = decodedText;
            displayResult(decodedText);
        }
        
        function onScanFailure(error) {
            // Ignore scan failures (they happen constantly while scanning)
        }
        
        function displayResult(text) {
            const resultSection = document.getElementById('resultSection');
            const resultContent = document.getElementById('resultContent');
            const partInfo = document.getElementById('partInfo');
            
            resultSection.style.display = 'block';
            
            // Try to parse as JSON (AutoNestCut format)
            try {
                const data = JSON.parse(text);
                
                // Check if it's AutoNestCut format
                if (data.v && data.id) {
                    showStatus('✅ AutoNestCut QR Code Detected!', 'success');
                    resultContent.innerHTML = formatJSON(data);
                    
                    // Display part information in a nice format
                    partInfo.innerHTML = `
                        <div class="part-info">
                            <div class="part-info-item">
                                <div class="part-info-label">Part ID</div>
                                <div class="part-info-value">${data.id || 'N/A'}</div>
                            </div>
                            <div class="part-info-item">
                                <div class="part-info-label">Part Name</div>
                                <div class="part-info-value">${data.n || 'N/A'}</div>
                            </div>
                            <div class="part-info-item">
                                <div class="part-info-label">Material</div>
                                <div class="part-info-value">${data.m || 'N/A'}</div>
                            </div>
                            <div class="part-info-item">
                                <div class="part-info-label">Dimensions (W×H×T)</div>
                                <div class="part-info-value">${data.d?.w || 0} × ${data.d?.h || 0} × ${data.d?.t || 0} mm</div>
                            </div>
                            <div class="part-info-item">
                                <div class="part-info-label">Board Number</div>
                                <div class="part-info-value">${data.b || 'N/A'}</div>
                            </div>
                            <div class="part-info-item">
                                <div class="part-info-label">Version</div>
                                <div class="part-info-value">${data.v || 'N/A'}</div>
                            </div>
                        </div>
                    `;
                } else {
                    showStatus('✅ QR Code Scanned (Generic JSON)', 'success');
                    resultContent.innerHTML = formatJSON(data);
                    partInfo.innerHTML = '';
                }
            } catch (e) {
                // Not JSON, display as plain text
                showStatus('✅ QR Code Scanned (Plain Text)', 'success');
                resultContent.textContent = text;
                partInfo.innerHTML = '';
            }
        }
        
        function formatJSON(obj) {
            return '<div class="json-display">' + 
                   JSON.stringify(obj, null, 2)
                       .replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;')
                       .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
                       .replace(/: "([^"]*)"/g, ': <span class="json-string">"$1"</span>')
                       .replace(/: (\d+\.?\d*)/g, ': <span class="json-number">$1</span>') +
                   '</div>';
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }
        
        function copyToClipboard() {
            navigator.clipboard.writeText(lastResult).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }
    </script>
</body>
</html>
