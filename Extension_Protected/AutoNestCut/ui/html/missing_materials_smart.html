<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Material Resolution - AutoNestCut</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            letter-spacing: 0.01em;
        }
        
        body {
            background: #ffffff;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 32px 40px;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.15);
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }
        
        .header p {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 400;
            line-height: 1.6;
        }
        
        .stats {
            display: flex;
            gap: 24px;
            margin-top: 16px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.95;
            font-weight: 500;
        }
        
        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px;
            background: #f8f9fa;
        }
        
        /* Material Group */
        .material-group {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.08);
            margin-bottom: 24px;
            overflow: hidden;
            border: 1px solid rgba(37, 99, 235, 0.1);
            transition: all 0.3s ease;
        }
        
        .material-group:hover {
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.15);
            transform: translateY(-2px);
        }
        
        .group-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            padding: 24px 28px;
            border-bottom: 2px solid rgba(37, 99, 235, 0.1);
        }
        
        .group-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .group-title h3 {
            font-size: 20px;
            font-weight: 700;
            color: #2563eb;
            letter-spacing: -0.01em;
        }
        
        .thickness-badge {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        
        .group-info {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 14px;
            color: #64748b;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        
        /* Options */
        .options-container {
            padding: 28px;
        }
        
        .option-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #ffffff;
        }
        
        .option-card:hover {
            border-color: #2563eb;
            background: rgba(37, 99, 235, 0.02);
            transform: translateX(4px);
        }
        
        .option-card.selected {
            border-color: #2563eb;
            background: rgba(37, 99, 235, 0.05);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        
        .option-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        
        .option-radio {
            margin-top: 2px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .option-content {
            flex: 1;
        }
        
        .option-title {
            font-size: 16px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        
        .option-description {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 12px;
            line-height: 1.6;
            font-weight: 400;
        }
        
        .option-details {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(37, 99, 235, 0.1);
        }
        
        .option-card.selected .option-details {
            display: block;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Form Elements */
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .form-group {
            flex: 1;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 8px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            background: #ffffff;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }
        
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            font-size: 14px;
            color: #334155;
            cursor: pointer;
            font-weight: 600;
        }
        
        /* Info Box */
        .info-box {
            background: rgba(37, 99, 235, 0.08);
            border-left: 4px solid #2563eb;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 14px;
            color: #1e40af;
            font-weight: 500;
            line-height: 1.6;
        }
        
        .success-box {
            background: rgba(34, 197, 94, 0.08);
            border-left-color: #22c55e;
            color: #166534;
        }
        
        /* Footer */
        .footer {
            background: white;
            border-top: 2px solid rgba(37, 99, 235, 0.1);
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 16px rgba(37, 99, 235, 0.08);
        }
        
        .footer-info {
            font-size: 15px;
            color: #64748b;
            font-weight: 600;
        }
        
        .footer-buttons {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            letter-spacing: 0.01em;
        }
        
        .btn-cancel {
            background: #f1f5f9;
            color: #475569;
            border: 2px solid #e2e8f0;
        }
        
        .btn-cancel:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }
        
        .btn-primary:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* Component List */
        .component-list {
            background: rgba(37, 99, 235, 0.03);
            border-radius: 8px;
            padding: 16px;
            margin-top: 12px;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid rgba(37, 99, 235, 0.1);
        }
        
        .component-item {
            padding: 8px 0;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid rgba(37, 99, 235, 0.08);
            font-weight: 500;
        }
        
        .component-item:last-child {
            border-bottom: none;
        }
        
        .component-name {
            font-weight: 700;
            color: #2563eb;
        }
        
        .component-dims {
            color: #64748b;
            margin-left: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Material Resolution Required</h1>
            <p>Some materials aren't in your database. Let's resolve them quickly.</p>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="materialCount">0</div>
                    <div class="stat-label">Materials</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="componentCount">0</div>
                    <div class="stat-label">Components</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="resolvedCount">0</div>
                    <div class="stat-label">Resolved</div>
                </div>
            </div>
        </div>
        
        <div class="content" id="materialsContainer">
            <!-- Materials will be inserted here -->
        </div>
        
        <div class="footer">
            <div class="footer-info">
                <span id="statusText">Select an option for each material</span>
            </div>
            <div class="footer-buttons">
                <button class="btn btn-cancel" onclick="cancelDialog()">Cancel</button>
                <button class="btn btn-primary" id="continueBtn" onclick="continueProcess()" disabled>Continue</button>
            </div>
        </div>
    </div>
    
    <script>
        let missingMaterials = [];
        let availableMaterials = [];
        let userChoices = {};
        
        // Notify Ruby that dialog is ready
        window.location = 'skp:ready@';
        
        function initializeDialog(materials, available) {
            missingMaterials = materials;
            availableMaterials = available;
            
            // Group materials by name (combine different thicknesses)
            const grouped = groupMaterialsByName(materials);
            
            renderMaterials(grouped);
            updateStats();
        }
        
        function groupMaterialsByName(materials) {
            const groups = {};
            
            materials.forEach((mat, index) => {
                if (!groups[mat.name]) {
                    groups[mat.name] = {
                        name: mat.name,
                        thicknesses: [],
                        totalComponents: 0,
                        indices: []
                    };
                }
                
                groups[mat.name].thicknesses.push(mat.thickness);
                groups[mat.name].totalComponents += mat.component_count;
                groups[mat.name].indices.push(index);
            });
            
            return Object.values(groups);
        }
        
        function renderMaterials(groups) {
            const container = document.getElementById('materialsContainer');
            container.innerHTML = '';
            
            groups.forEach((group, groupIndex) => {
                const card = createMaterialGroup(group, groupIndex);
                container.appendChild(card);
            });
        }
        
        function createMaterialGroup(group, groupIndex) {
            const div = document.createElement('div');
            div.className = 'material-group';
            
            const thicknessText = group.thicknesses.length === 1 
                ? `${group.thicknesses[0]}mm` 
                : `${group.thicknesses.length} thicknesses`;
            
            // Get all components for this group
            const allComponents = [];
            group.indices.forEach(idx => {
                allComponents.push(...missingMaterials[idx].components);
            });
            
            // Find matching materials in database
            const matchingMaterials = availableMaterials.filter(m => 
                m.name.toLowerCase().includes(group.name.toLowerCase()) ||
                group.name.toLowerCase().includes(m.name.toLowerCase())
            );
            
            div.innerHTML = `
                <div class="group-header">
                    <div class="group-title">
                        <h3>${escapeHtml(group.name)}</h3>
                        <span class="thickness-badge">${thicknessText}</span>
                    </div>
                    <div class="group-info">
                        <div class="info-item">
                            📦 ${group.totalComponents} component${group.totalComponents > 1 ? 's' : ''}
                        </div>
                        <div class="info-item">
                            📏 ${group.thicknesses.join(', ')}mm
                        </div>
                    </div>
                    <div class="component-list">
                        ${allComponents.slice(0, 10).map(comp => `
                            <div class="component-item">
                                <span class="component-name">${escapeHtml(comp.name || 'Unnamed')}</span>
                                <span class="component-dims">${comp.width}×${comp.height}mm</span>
                            </div>
                        `).join('')}
                        ${allComponents.length > 10 ? `<div class="component-item">... and ${allComponents.length - 10} more</div>` : ''}
                    </div>
                </div>
                
                <div class="options-container">
                    <!-- Option 1: Use Existing -->
                    <div class="option-card" onclick="selectOption(${groupIndex}, 'existing')">
                        <div class="option-header">
                            <input type="radio" name="option-${groupIndex}" value="existing" class="option-radio">
                            <div class="option-content">
                                <div class="option-title">🔗 Map to existing material</div>
                                <div class="option-description">Use a material already in your database</div>
                                <div class="option-details">
                                    <div class="form-group">
                                        <label>Select material:</label>
                                        <select id="existing-${groupIndex}" onchange="updateChoice(${groupIndex}, 'existing')">
                                            <option value="">-- Choose material --</option>
                                            ${matchingMaterials.map(m => `
                                                <option value="${escapeHtml(m.name)}">
                                                    ${escapeHtml(m.name)} (${m.width}×${m.height}×${m.thickness}mm)
                                                </option>
                                            `).join('')}
                                            ${matchingMaterials.length === 0 ? '<option disabled>No similar materials found</option>' : ''}
                                        </select>
                                    </div>
                                    ${matchingMaterials.length === 0 ? '<div class="info-box">💡 No similar materials found. Try creating a new one instead.</div>' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Option 2: Create Standard Sheet -->
                    <div class="option-card selected" onclick="selectOption(${groupIndex}, 'standard')">
                        <div class="option-header">
                            <input type="radio" name="option-${groupIndex}" value="standard" class="option-radio" checked>
                            <div class="option-content">
                                <div class="option-title">➕ Create standard sheet</div>
                                <div class="option-description">Add a new material with standard sheet dimensions</div>
                                <div class="option-details">
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>Width (mm):</label>
                                            <input type="number" id="width-${groupIndex}" value="2440" onchange="updateChoice(${groupIndex}, 'standard')">
                                        </div>
                                        <div class="form-group">
                                            <label>Height (mm):</label>
                                            <input type="number" id="height-${groupIndex}" value="1220" onchange="updateChoice(${groupIndex}, 'standard')">
                                        </div>
                                    </div>
                                    <div class="checkbox-group">
                                        <input type="checkbox" id="save-${groupIndex}" checked onchange="updateChoice(${groupIndex}, 'standard')">
                                        <label for="save-${groupIndex}">💾 Save to database for future use</label>
                                    </div>
                                    <div class="info-box success-box" style="margin-top: 12px;">
                                        ✅ This will create "${escapeHtml(group.name)}" with ${thicknessText}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Option 3: Custom Part -->
                    <div class="option-card" onclick="selectOption(${groupIndex}, 'custom')">
                        <div class="option-header">
                            <input type="radio" name="option-${groupIndex}" value="custom" class="option-radio">
                            <div class="option-content">
                                <div class="option-title">✂️ Custom cut-to-size</div>
                                <div class="option-description">For materials like glass or metal that are ordered to exact size</div>
                                <div class="option-details">
                                    <div class="info-box">
                                        📐 Material will use exact component dimensions. Not saved to database.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Initialize default choice
            group.indices.forEach(idx => {
                const mat = missingMaterials[idx];
                userChoices[idx] = {
                    type: 'standard',
                    width: 2440,
                    height: 1220,
                    saveToDb: true,
                    materialName: mat.name,
                    thickness: mat.thickness
                };
            });
            
            return div;
        }
        
        function selectOption(groupIndex, type) {
            const cards = document.querySelectorAll('.material-group')[groupIndex].querySelectorAll('.option-card');
            cards.forEach(card => card.classList.remove('selected'));
            
            const selectedCard = cards[type === 'existing' ? 0 : type === 'standard' ? 1 : 2];
            selectedCard.classList.add('selected');
            selectedCard.querySelector('input[type="radio"]').checked = true;
            
            updateChoice(groupIndex, type);
        }
        
        function updateChoice(groupIndex, type) {
            const groups = groupMaterialsByName(missingMaterials);
            const group = groups[groupIndex];
            
            group.indices.forEach(idx => {
                const mat = missingMaterials[idx];
                
                if (type === 'existing') {
                    const select = document.getElementById(`existing-${groupIndex}`);
                    userChoices[idx] = {
                        type: 'existing',
                        existingMaterial: select.value,
                        materialName: mat.name,
                        thickness: mat.thickness
                    };
                } else if (type === 'standard') {
                    const width = document.getElementById(`width-${groupIndex}`).value;
                    const height = document.getElementById(`height-${groupIndex}`).value;
                    const save = document.getElementById(`save-${groupIndex}`).checked;
                    userChoices[idx] = {
                        type: 'standard',
                        width: parseFloat(width),
                        height: parseFloat(height),
                        saveToDb: save,
                        materialName: mat.name,
                        thickness: mat.thickness
                    };
                } else if (type === 'custom') {
                    userChoices[idx] = {
                        type: 'custom',
                        materialName: mat.name,
                        thickness: mat.thickness
                    };
                }
            });
            
            validateChoices();
        }
        
        function validateChoices() {
            let allValid = true;
            let resolvedCount = 0;
            
            for (let i = 0; i < missingMaterials.length; i++) {
                const choice = userChoices[i];
                if (!choice) {
                    allValid = false;
                    break;
                }
                
                if (choice.type === 'existing' && !choice.existingMaterial) {
                    allValid = false;
                } else {
                    resolvedCount++;
                }
            }
            
            document.getElementById('continueBtn').disabled = !allValid;
            document.getElementById('resolvedCount').textContent = resolvedCount;
            document.getElementById('statusText').textContent = allValid 
                ? '✅ All materials resolved!' 
                : '⚠️ Select an option for each material';
        }
        
        function updateStats() {
            const groups = groupMaterialsByName(missingMaterials);
            const totalComponents = missingMaterials.reduce((sum, m) => sum + m.component_count, 0);
            
            document.getElementById('materialCount').textContent = groups.length;
            document.getElementById('componentCount').textContent = totalComponents;
            validateChoices();
        }
        
        function continueProcess() {
            window.location = 'skp:material_choices@' + JSON.stringify(userChoices);
        }
        
        function cancelDialog() {
            window.location = 'skp:cancel_dialog@';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
